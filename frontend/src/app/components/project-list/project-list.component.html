<div class="container-fluid mt-4">
  <div class="row">
    <!-- 📍 Lista de Proyectos (Columna Izquierda) -->
    <div class="col-md-4 bg-light p-3 border-end">
      <ul class="list-group scrollable-list">
        <li *ngFor="let project of projects" class="list-group-item list-group-item-action"
            (click)="selectProject(project === selectedProject ? null : project)"
            [class.active]="project === selectedProject">
          <div class="d-flex my">
            <label class="label-project">Nombre:</label><p class="m-0 mx-2"> {{ project.name }}</p>
          </div>
          <div class="d-flex">
            <label class="label-project">Ubicación:</label><p class="m-0 mx-2"> {{ project.location }}</p>
          </div>
          <div class="d-flex">
            <label class="label-project">Precio:</label><p class="m-0 mx-2"> {{ project.price }}</p>
          </div>
        </li>
      </ul>
    </div>

    <!-- 🗺️ Mapa (Columna Derecha) -->
    <div class="col-md-8 p-3">
      <app-project-map [projects]="projects"
                       [selectedProject]="selectedProject"
                       [center]="center">
      </app-project-map>
    </div>
  </div>
</div>
